name: Verify Source and Build UI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install complete validation dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node -e "require('./main'); console.log('Playwright ' + require('playwright/package.json').version + ' and application modules loaded successfully')"

      - name: Check backend syntax and embeddings regression tests
        run: |
          find src scripts tests -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --check main.js
          node --test tests/*.test.js

      - name: Build frontend
        run: npm run build:ui

      - name: Package source and frontend artifact
        run: |
          mkdir -p "$RUNNER_TEMP/aistudio-release" artifacts
          git archive HEAD | tar -x -C "$RUNNER_TEMP/aistudio-release"
          cp -a ui/dist "$RUNNER_TEMP/aistudio-release/ui/"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const metadata = {
            revision: process.env.GITHUB_SHA,
            version: require('./package.json').version,
            workflowRun: process.env.GITHUB_RUN_ID,
            artifactKind: 'source-and-ui',
            runtimeDependenciesIncluded: false,
            playwrightVersion: require('playwright/package.json').version,
            runtimeArtifact: 'Docker image from the Publish Docker Image workflow'
          };
          const content = JSON.stringify(metadata, null, 2) + '\n';
          fs.writeFileSync('artifacts/release-metadata.json', content);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'aistudio-release/release-metadata.json'), content);
          NODE
          tar -czf artifacts/aistudio-source-ui.tar.gz -C "$RUNNER_TEMP/aistudio-release" .
          cd artifacts
          sha256sum aistudio-source-ui.tar.gz > SHA256SUMS

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistudio-source-ui-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
